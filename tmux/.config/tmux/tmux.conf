# ===== Prefix =====
# เปลี่ยนจาก Ctrl-b เป็น Ctrl-a (กดง่ายกว่า)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ===== True Color (สำคัญมากสำหรับ Neovim) =====
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB,xterm-256color:RGB"

# ===== ลด escape time (Neovim ใน tmux จะไม่ delay) =====
set -sg escape-time 0
set -g focus-events on

# ===== Mouse =====
set -g mouse on

# ===== เริ่มนับจาก 1 (กดปุ่ม 1-9 ที่ keyboard ง่ายกว่า 0) =====
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ===== Window & Pane =====
# split pane ด้วยปุ่มที่จำง่าย
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# เปิด window ใหม่ที่ path เดิม
bind c new-window -c "#{pane_current_path}"

# สลับ pane ด้วย Alt+arrow (ไม่ต้องกด prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# resize pane ด้วย prefix + Shift+arrow
bind -r S-Left resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up resize-pane -U 3
bind -r S-Down resize-pane -D 3

# ===== สลับ window เร็ว (แทน tab ของ Terminal.app) =====
# Ctrl-a + n/p = window ถัดไป/ก่อนหน้า
# หรือ Ctrl-a + 1-9 = ไปยัง window นั้นตรง ๆ

# ย้ายตำแหน่ง window (สลับลำดับ) ด้วย Ctrl-Shift-arrow ไม่ต้องกด prefix
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# ===== Claude Code แบบ popup ลอย (แยก session ต่อ directory) =====
bind -r y run-shell '\
  SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'

# ===== History =====
set -g history-limit 50000

# ===== Reload config =====
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ===== Copy mode (vi style) =====
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ===== Theme (Solarized, ported from craftzdog/dotfiles) =====
if-shell "uname -s | grep -q Darwin" "source-file ~/.config/tmux/macos.conf"
source-file ~/.config/tmux/theme.conf
source-file ~/.config/tmux/statusline.conf
