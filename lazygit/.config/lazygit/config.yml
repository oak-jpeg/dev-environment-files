customCommands:
  - key: "<c-a>"
    context: "files"
    command: >
      bash -c '
      msg=$(git diff --cached | claude -p "Write a concise conventional commit message for this diff. Output only the commit message, nothing else. Format: type(scope): description");
      if [ -n "$msg" ]; then
        git commit -m "$msg";
      fi'
    description: "AI Commit with Claude"
    loadingText: "Claude is writing commit message..."
    subprocess: true
gui:
  mouseEvents: false
